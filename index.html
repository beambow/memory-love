<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untuk Kamu ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--f1:"Cinzel Decorative","Cinzel",Georgia,serif;--f2:"Cinzel",Georgia,serif;--f3:"Great Vibes","Brush Script MT",cursive,Georgia,serif}
html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden;font-family:var(--f2);color-scheme:dark;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#ph{position:absolute;inset:0;overflow:hidden}
.card{position:absolute;overflow:hidden;box-sizing:border-box;border:3px solid rgba(255,255,255,.92);box-shadow:0 14px 50px rgba(0,0,0,.8);opacity:0;animation:land 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.card.full{border:0;animation-duration:2.6s}
.card .im{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 14s ease-out forwards}
.card .im.ph{background:linear-gradient(135deg,#ff9ec4,#7a5af8)}
@keyframes land{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(1.45)}55%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.15) translate(1.5%,-1.5%)}}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(20,0,10,.3) 30%,rgba(0,0,0,.75) 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
#open{position:fixed;left:0;right:0;top:12%;text-align:center;font-family:var(--f2);font-size:clamp(16px,4.2vw,30px);letter-spacing:.3em;text-transform:uppercase;text-shadow:0 0 18px #ff4f9a,0 2px 10px #000;opacity:0;pointer-events:none;z-index:3;padding:0 20px}
@keyframes op{0%{opacity:0;letter-spacing:.1em}25%,70%{opacity:1}100%{opacity:0;letter-spacing:.42em}}
#shade{position:fixed;left:0;right:0;bottom:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:opacity 2s;pointer-events:none;z-index:3}
#shade.on{opacity:1}
#msg{position:fixed;left:0;right:0;bottom:calc(8% + env(safe-area-inset-bottom,0px));text-align:center;padding:0 22px;font-family:var(--f3);font-size:clamp(38px,10.5vw,78px);line-height:1.1;color:#fff;text-shadow:0 0 14px #ff4f9a,0 0 34px #ff2a7f,0 3px 12px #000;z-index:3;pointer-events:none}
.w{display:inline-block;white-space:nowrap;margin:0 .12em}
.ch{display:inline-block;opacity:0;animation:ch .9s ease-out forwards}
@keyframes ch{0%{opacity:0;transform:translateY(14px) scale(1.5)}100%{opacity:1;transform:none}}
.fh{position:fixed;bottom:-40px;z-index:10;pointer-events:none;opacity:0;animation:rise var(--d) linear forwards;text-shadow:0 0 8px rgba(255,60,140,.8)}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}12%{opacity:.9}100%{transform:translate(var(--x),-112vh) scale(1.25);opacity:0}}
#st{position:fixed;inset:0;z-index:9;background:radial-gradient(circle at 50% 45%,#2a0716,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;transition:opacity 1s;text-align:center;padding:0 24px}
#st.off{opacity:0;pointer-events:none}
#st h1{margin:0;font-family:var(--f1);font-size:clamp(28px,8vw,46px);letter-spacing:.08em;text-shadow:0 0 20px #ff4f9a}
#st p{margin:0;font-family:var(--f3);font-size:clamp(26px,6.5vw,38px);color:#ffc2dc}
#st small{font-family:var(--f2);color:#ff8fbd;letter-spacing:.12em;animation:tap 1.1s infinite}
@keyframes tap{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(6px)}}
#cute{width:160px;animation:bob 1.5s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,70,140,.8))}
#cute.pop{animation:pop .7s ease-in forwards}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg) scale(1)}50%{transform:translateY(-14px) rotate(4deg) scale(1.08)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.8)}100%{transform:scale(6);opacity:0}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 3.6s infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#rp{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;border:1px solid #ff7eb6;background:rgba(0,0,0,.55);color:#ffd3e6;font-family:var(--f2);padding:9px 14px;border-radius:999px;font-size:14px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s}
#rp.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="stage"><div id="ph"></div><div id="vig"></div><canvas id="c"></canvas></div>
<div id="fl"></div><div id="open"></div><div id="shade"></div><div id="msg"></div>
<button id="rp">↻ Putar lagi</button>
<div id="st">
  <svg id="cute" viewBox="-4 -4 108 96" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ec4"/><stop offset="1" stop-color="#ff3f86"/></linearGradient></defs>
    <path d="M50 85C10 55 0 35 0 22 0 8 12 0 26 0c11 0 20 6 24 15C54 6 63 0 74 0c14 0 26 8 26 22 0 13-10 33-50 63z" fill="url(#g)"/>
    <ellipse cx="24" cy="15" rx="9" ry="5" fill="#fff" opacity=".45" transform="rotate(-30 24 15)"/>
    <g class="eye"><ellipse cx="35" cy="36" rx="5.5" ry="7.5" fill="#3a0a1e"/><circle cx="33" cy="33" r="2.3" fill="#fff"/></g>
    <g class="eye"><ellipse cx="65" cy="36" rx="5.5" ry="7.5" fill="#3a0a1e"/><circle cx="63" cy="33" r="2.3" fill="#fff"/></g>
    <ellipse cx="22" cy="50" rx="8" ry="4.5" fill="#ff5c93" opacity=".75"/><ellipse cx="78" cy="50" rx="8" ry="4.5" fill="#ff5c93" opacity=".75"/>
    <path d="M43 49q7 8 14 0" stroke="#7a1040" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  </svg>
  <h1>Untuk Kamu</h1>
  <p>ada kejutan kecil di dalam sini… 🥺</p>
  <small>ketuk aku ya</small>
</div>
<audio id="a" src="musik.mp3" preload="auto"></audio>
<script>
/* ====== PENGATURAN (silakan ubah) ====== */
const JUMLAH_FOTO = 10;                       // foto/1.jpg ... foto/10.jpg
const PEMBUKA = "Setiap kenangan denganmu…";  // tulisan di awal
const PESAN = "Untuk kamu, yang selalu ada di hatiku";
const MULAI_FOTO = 4;                         // detik, foto pertama muncul
const JEDA = 2.6;                             // detik antar foto
const PESAN_DETIK = 30;                       // detik, pesan akhir muncul
/* ======================================= */
const $=id=>document.getElementById(id),R=Math.random,u=(a,b)=>a+R()*(b-a);
const cv=$('c'),cx=cv.getContext('2d'),off=document.createElement('canvas'),ox=off.getContext('2d'),gl=document.createElement('canvas'),gx=gl.getContext('2d'),ph=$('ph'),au=$('a'),stage=$('stage'),fl=$('fl');
let W,H,D,U,run=false,t0=0,tp=0,drawn=0,raf=0,shown=0,msgOn=false,imgs=[],pulse=0,fr=0,timers=[];
const DUR=15000;

/* Love: replika algoritma di video (10000 goresan isi + 3500 goresan tepi) */
const S=[],hp=(a,s)=>[16*Math.sin(a)**3*s,(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*s];
for(let i=0;i<10000;i++){const a=u(0,2*Math.PI),[x,y]=hp(a,u(.5,15.5)),g=Math.atan2(y,x)+u(-.5,.5),l=u(4,14);
  S.push([x,y,x+l*Math.cos(g),y+l*Math.sin(g),`rgb(255,${u(.25,.55)*255|0},${u(.65,.85)*255|0})`,u(.5,1.2)]);}
for(let i=0;i<3500;i++){const a=u(0,2*Math.PI),[x,y]=hp(a,16),g=Math.atan2(y,x)+u(-.35,.35),l=u(10,32),x0=x+u(-2,2),y0=y+u(-2,2);
  S.push([x0,y0,x0+l*Math.cos(g),y0+l*Math.sin(g),`rgb(255,${u(.45,.75)*255|0},${u(.75,.95)*255|0})`,u(.4,.9)]);}
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=off.width=W*D;cv.height=off.height=H*D;gl.width=Math.max(8,W*D/8|0);gl.height=Math.max(8,H*D/8|0);U=Math.min(W/580,H/600);ox.lineCap='round';redraw();}
const sx=x=>(W/2+x*U)*D,sy=y=>(H/2-(y+41)*U)*D;
function drawRange(a,b){for(let i=a;i<b;i++){const s=S[i];ox.strokeStyle=s[4];ox.lineWidth=Math.max(.7,s[5]*U*1.5)*D;ox.beginPath();ox.moveTo(sx(s[0]),sy(s[1]));ox.lineTo(sx(s[2]),sy(s[3]));ox.stroke();}}
function glow(){gx.clearRect(0,0,gl.width,gl.height);gx.drawImage(off,0,0,gl.width,gl.height);}
function redraw(){ox.clearRect(0,0,off.width,off.height);drawRange(0,drawn);glow();}

/* Efek ringan (transform/opacity saja, aman untuk HP) */
function impact(f,s){
  fl.animate([{opacity:f},{opacity:0}],{duration:700,easing:'ease-out'});
  stage.animate([{transform:'none'},{transform:`translate(${-6*s}px,${4*s}px) scale(${1+.015*s})`},{transform:`translate(${5*s}px,${-5*s}px)`},{transform:`translate(${-3*s}px,${2*s}px)`},{transform:'none'}],{duration:500+s*150,easing:'ease-out'});
  pulse=1;try{navigator.vibrate&&navigator.vibrate(s>1?[60,40,140]:35);}catch(e){}
}
function heart(){const s=document.createElement('span');s.className='fh';s.textContent=R()<.5?'♥':'❤';
  s.style.cssText=`left:${u(2,96)}%;font-size:${u(14,34)}px;color:hsl(${u(330,350)},100%,${u(65,80)}%);--d:${u(5,9)}s;--x:${u(-40,40)}px`;
  s.addEventListener('animationend',()=>s.remove());document.body.appendChild(s);}
setInterval(()=>{if(!document.hidden&&document.querySelectorAll('.fh').length<12)heart();},650);
function burst(){for(let i=0;i<22;i++)timers.push(setTimeout(heart,i*70));}
function typeMsg(){const m=$('msg');m.innerHTML='';let n=0;
  PESAN.split(' ').forEach(w=>{const sp=document.createElement('span');sp.className='w';[...w].forEach(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c;s.style.animationDelay=(n++*.07)+'s';sp.appendChild(s);});m.appendChild(sp);n++;});
  $('shade').classList.add('on');}

/* Muat foto: coba beberapa ekstensi (GitHub Pages membedakan huruf besar/kecil) */
const EXT=['jpg','jpeg','png','webp','JPG','JPEG','PNG'];
function loadOne(n){return new Promise(res=>{let i=0;(function t(){if(i>=EXT.length)return res(null);const src=`foto/${n}.${EXT[i++]}`,im=new Image();im.onload=()=>res(src);im.onerror=t;im.src=src;})();});}
async function loadAll(){imgs=await Promise.all(Array.from({length:JUMLAH_FOTO},(_,i)=>loadOne(i+1)));}

/* Tumpukan foto: tiap foto menimpa yang sebelumnya sampai layar penuh, foto terakhir full */
const POS=[[.5,.5],[.27,.27],[.73,.73],[.73,.27],[.27,.73],[.5,.18],[.5,.82],[.14,.5],[.86,.5]];
function addPhoto(i){
  const last=i===JUMLAH_FOTO-1,c=document.createElement('div'),im=document.createElement('div'),src=imgs[i];
  c.className='card'+(last?' full':'');im.className='im'+(src?'':' ph');if(src)im.style.backgroundImage=`url("${src}")`;
  c.appendChild(im);
  if(last)c.style.cssText='left:50%;top:50%;width:100%;height:100%;--r:0deg';
  else{const p=POS[i%POS.length];c.style.cssText=`left:${p[0]*100}%;top:${p[1]*100}%;width:62%;height:62%;--r:${u(-6,6)}deg`;}
  ph.appendChild(c);
  timers.push(setTimeout(()=>{impact(last?.9:.4,last?2.2:1);if(last)burst();},last?1500:700));
}

function frame(t){
  if(!run)return;
  const e=t-t0,dt=Math.min(64,t-tp);tp=t;fr++;
  const tg=Math.min(S.length,(e/DUR*S.length)|0);
  if(tg>drawn){drawRange(drawn,tg);drawn=tg;if(fr%8===0||tg>=S.length)glow();}
  pulse=Math.max(0,pulse-dt/650);
  const k=(drawn>=S.length?1+.04*Math.pow(Math.sin(e/1000*Math.PI*1.3)**2,6):1)+.1*pulse*pulse;
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
  cx.translate(cv.width/2,cv.height/2);cx.scale(k,k);cx.translate(-cv.width/2,-cv.height/2);
  cx.globalCompositeOperation='lighter';cx.globalAlpha=.9;cx.drawImage(gl,0,0,cv.width,cv.height);cx.drawImage(gl,0,0,cv.width,cv.height);
  cx.globalCompositeOperation='source-over';cx.globalAlpha=1;cx.drawImage(off,0,0);
  while(shown<JUMLAH_FOTO&&e/1000>=MULAI_FOTO+shown*JEDA)addPhoto(shown++);
  if(!msgOn&&e/1000>=PESAN_DETIK){msgOn=true;typeMsg();}
  if(e/1000>=PESAN_DETIK+5)$('rp').classList.add('on');
  raf=requestAnimationFrame(frame);
}
function start(){
  cancelAnimationFrame(raf);timers.forEach(clearTimeout);timers=[];
  ph.innerHTML='';$('msg').innerHTML='';$('shade').classList.remove('on');$('rp').classList.remove('on');
  shown=0;drawn=0;msgOn=false;pulse=0;ox.clearRect(0,0,off.width,off.height);glow();
  const o=$('open');o.textContent=PEMBUKA;o.style.animation='none';o.offsetWidth;o.style.animation='op 4s ease forwards';
  au.currentTime=0;au.play().catch(()=>{});
  t0=tp=performance.now();run=true;raf=requestAnimationFrame(frame);
}
$('st').onclick=async()=>{$('cute').classList.add('pop');await loadAll();$('st').classList.add('off');start();};
$('rp').onclick=start;
addEventListener('resize',size);size();
</script>
</body>
</html>
