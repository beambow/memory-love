<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untuk Kamu ❤</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color-scheme:dark}
#ph{position:fixed;inset:0;overflow:hidden;background:#000}
.card{position:absolute;overflow:hidden;box-sizing:border-box;border:3px solid rgba(255,255,255,.92);box-shadow:0 14px 50px rgba(0,0,0,.75);opacity:0;animation:land 1.5s cubic-bezier(.2,.8,.2,1) forwards}
.card.full{border:0;animation-duration:2.4s}
.card .im{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 14s ease-out forwards;filter:contrast(1.06) saturate(1.1) sepia(.14)}
.card .im.ph{background:linear-gradient(135deg,#ff9ec4,#7a5af8)}
@keyframes land{
0%{opacity:0;filter:blur(10px) brightness(.4);transform:translate(-50%,-50%) rotate(var(--r)) scale(1.35)}
100%{opacity:1;filter:blur(0) brightness(1);transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14) translate(1.5%,-1.5%)}}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.12) 35%,rgba(0,0,0,.7) 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 0 4px rgba(0,0,0,.8)) drop-shadow(0 0 12px rgba(255,90,160,.8))}
#msg{position:fixed;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom,0px));text-align:center;padding:0 24px;font-size:clamp(20px,4.6vw,38px);font-style:italic;letter-spacing:.04em;text-shadow:0 2px 14px #000,0 0 30px rgba(255,80,150,.7);opacity:0;transition:opacity 2.5s}
#msg.on{opacity:1}
#st{position:fixed;inset:0;z-index:9;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:opacity 1s}
#st.off{opacity:0;pointer-events:none}
#st .h{font-size:76px;animation:b 1.2s infinite;filter:drop-shadow(0 0 14px #ff4f9a)}
#st p{margin:0;color:#ffc2dc;font-size:18px;letter-spacing:.08em}
@keyframes b{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#rp{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;border:1px solid #ff7eb6;background:rgba(0,0,0,.5);color:#ffd3e6;padding:9px 14px;border-radius:999px;font-size:14px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s}
#rp.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="ph"></div>
<div id="vig"></div>
<canvas id="c"></canvas>
<div id="msg"></div>
<button id="rp">↻ Putar lagi</button>
<div id="st"><div class="h">❤</div><p>Ketuk untuk membuka</p></div>
<audio id="a" src="musik.mp3" preload="auto"></audio>
<script>
/* ====== PENGATURAN (silakan ubah) ====== */
const JUMLAH_FOTO = 10;               // foto/1.jpg ... foto/10.jpg
const PESAN = "Untuk kamu, yang selalu ada di hatiku ❤";
const MULAI_FOTO = 4;                 // detik, foto pertama muncul
const JEDA = 2.6;                     // detik antar foto
const PESAN_DETIK = 30;               // detik, pesan akhir muncul
/* ======================================= */
const $=id=>document.getElementById(id),R=Math.random,u=(a,b)=>a+R()*(b-a);
const cv=$('c'),cx=cv.getContext('2d'),off=document.createElement('canvas'),ox=off.getContext('2d'),ph=$('ph'),au=$('a');
let W,H,D,U,run=false,t0=0,drawn=0,raf=0,shown=0,msgOn=false,imgs=[];
const DUR=15000;

/* Love: replika algoritma di video (10000 goresan isi + 3500 goresan tepi) */
const S=[],hp=(a,s)=>[16*Math.sin(a)**3*s,(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*s];
for(let i=0;i<10000;i++){const a=u(0,2*Math.PI),[x,y]=hp(a,u(.5,15.5)),g=Math.atan2(y,x)+u(-.5,.5),l=u(4,14);
  S.push([x,y,x+l*Math.cos(g),y+l*Math.sin(g),`rgb(255,${u(.25,.55)*255|0},${u(.65,.85)*255|0})`,u(.5,1.2)]);}
for(let i=0;i<3500;i++){const a=u(0,2*Math.PI),[x,y]=hp(a,16),g=Math.atan2(y,x)+u(-.35,.35),l=u(10,32),x0=x+u(-2,2),y0=y+u(-2,2);
  S.push([x0,y0,x0+l*Math.cos(g),y0+l*Math.sin(g),`rgb(255,${u(.45,.75)*255|0},${u(.75,.95)*255|0})`,u(.4,.9)]);}
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=off.width=W*D;cv.height=off.height=H*D;U=Math.min(W/580,H/600);ox.lineCap='round';redraw();}
const sx=x=>(W/2+x*U)*D,sy=y=>(H/2-(y+41)*U)*D;
function drawRange(a,b){for(let i=a;i<b;i++){const s=S[i];ox.strokeStyle=s[4];ox.lineWidth=Math.max(.7,s[5]*U*1.5)*D;ox.beginPath();ox.moveTo(sx(s[0]),sy(s[1]));ox.lineTo(sx(s[2]),sy(s[3]));ox.stroke();}}
function redraw(){ox.clearRect(0,0,off.width,off.height);drawRange(0,drawn);}

/* Muat foto: coba beberapa ekstensi (GitHub Pages membedakan huruf besar/kecil) */
const EXT=['jpg','jpeg','png','webp','JPG','JPEG','PNG'];
function loadOne(n){return new Promise(res=>{let i=0;(function t(){if(i>=EXT.length)return res(null);const src=`foto/${n}.${EXT[i++]}`,im=new Image();im.onload=()=>res(src);im.onerror=t;im.src=src;})();});}
async function loadAll(){const r=await Promise.all(Array.from({length:JUMLAH_FOTO},(_,i)=>loadOne(i+1)));imgs=r.map(x=>x||null);}

/* Tumpukan foto: tiap foto menimpa yang sebelumnya sampai layar penuh, foto terakhir full */
const POS=[[.5,.5],[.27,.27],[.73,.73],[.73,.27],[.27,.73],[.5,.18],[.5,.82],[.14,.5],[.86,.5]];
function addPhoto(i){
  const last=i===JUMLAH_FOTO-1,c=document.createElement('div'),im=document.createElement('div'),src=imgs[i];
  c.className='card'+(last?' full':'');im.className='im'+(src?'':' ph');if(src)im.style.backgroundImage=`url("${src}")`;
  c.appendChild(im);
  if(last){c.style.cssText='left:50%;top:50%;width:100%;height:100%;--r:0deg';}
  else{const p=POS[i%POS.length];c.style.cssText=`left:${p[0]*100}%;top:${p[1]*100}%;width:62%;height:62%;--r:${u(-6,6)}deg`;}
  ph.appendChild(c);
}

function frame(t){
  if(!run)return;
  const e=t-t0,tg=Math.min(S.length,(e/DUR*S.length)|0);
  if(tg>drawn){drawRange(drawn,tg);drawn=tg;}
  const k=drawn>=S.length?1+.04*Math.pow(Math.sin(e/1000*Math.PI*1.3)**2,6):1;
  cx.clearRect(0,0,cv.width,cv.height);cx.save();cx.translate(cv.width/2,cv.height/2);cx.scale(k,k);cx.translate(-cv.width/2,-cv.height/2);cx.drawImage(off,0,0);cx.restore();
  while(shown<JUMLAH_FOTO&&e/1000>=MULAI_FOTO+shown*JEDA){addPhoto(shown++);}
  if(!msgOn&&e/1000>=PESAN_DETIK){msgOn=true;$('msg').textContent=PESAN;$('msg').classList.add('on');}
  if(e/1000>=PESAN_DETIK+5)$('rp').classList.add('on');
  raf=requestAnimationFrame(frame);
}
function start(){
  cancelAnimationFrame(raf);ph.innerHTML='';shown=0;drawn=0;msgOn=false;ox.clearRect(0,0,off.width,off.height);
  $('msg').classList.remove('on');$('rp').classList.remove('on');
  au.currentTime=0;au.play().catch(()=>{});
  t0=performance.now();run=true;raf=requestAnimationFrame(frame);
}
$('st').onclick=async()=>{$('st').querySelector('p').textContent='Sebentar ya…';await loadAll();$('st').classList.add('off');start();};
$('rp').onclick=start;
addEventListener('resize',size);size();
</script>
</body>
</html>
